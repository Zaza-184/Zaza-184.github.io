<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAZA بتاع ألعاب | كتالوج</title>
<meta name="theme-color" content="#030712">
<link rel="icon" href="assets/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;800&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030712;--panel:#0a1224;--line:#15305c;--ps:#0070d1;--ps2:#33a6ff;--tx:#eaf2ff;--mu:#8aa3c7;--tri:#3bd1a8;--cir:#ff5a67;--crs:#4aa3ff;--sq:#ff7ad9}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 420px at 50% -80px,#0b2f66 0,transparent 70%),var(--bg);color:var(--tx);font:400 16px/1.5 Tajawal,system-ui,sans-serif;min-height:100vh}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 8px}
.hero img{width:min(300px,70vw);aspect-ratio:1;mix-blend-mode:lighten}
.wa{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wa a{color:#fff;text-decoration:none;font-weight:700;background:linear-gradient(180deg,#0a7fe8,#00479b);border:1px solid #3aa0ff;border-radius:99px;padding:8px 18px;direction:ltr}
.bar{position:sticky;top:0;z-index:5;background:rgba(3,7,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px;display:grid;gap:8px;max-width:1100px;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs button{font:800 15px Changa,sans-serif;color:var(--mu);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;flex:none;white-space:nowrap;cursor:pointer}
.tabs button b{font-size:18px;margin-inline-end:5px}
.tabs button[aria-selected=true]{color:#fff;background:#0b2a58;border-color:var(--ps2);box-shadow:0 0 14px #0070d166}
.chips{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}.chips[hidden]{display:none}
.chips button{flex:none;font:700 13px Changa,sans-serif;color:var(--mu);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.chips button[aria-pressed=true]{color:#fff;background:#0b2a58;border-color:var(--ps2)}
.tabs button:focus-visible,input:focus-visible,.cta:focus-visible{outline:2px solid var(--ps2);outline-offset:2px}
input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;padding:10px 14px}
#cnt{color:var(--mu);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:14px 12px 60px}
h2{font:800 20px Changa,sans-serif;margin:18px 4px 10px;color:var(--ps2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--ps2);box-shadow:0 0 18px #0070d155}
.ic{position:relative;aspect-ratio:1;background:#000;display:grid;overflow:hidden}
.ic img,.ph{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.ph{display:grid;place-items:center;font:800 clamp(18px,5vw,30px) Changa,sans-serif;color:var(--ps2);background:linear-gradient(135deg,#06183a,#0a3a82);letter-spacing:1px}
.ic.n1{grid-template:1fr/1fr}
.ic.n2>*{position:absolute;inset:0}.ic.n2>*:last-child{clip-path:polygon(100% 0,100% 100%,0 100%)}
.ic.n2::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1.5px),#fff calc(50% - 1.5px),#fff calc(50% + 1.5px),transparent calc(50% + 1.5px));filter:drop-shadow(0 0 3px #0070d1)}
.ic.g2{grid-template:1fr 1fr/1fr 1fr;gap:2px}
.ic.g3{grid-template:1fr 1fr/repeat(6,1fr);gap:2px}.ic.g3>:nth-child(-n+3){grid-column:span 2}.ic.g3>:nth-child(n+4){grid-column:span 3}.ic.g2.c3>:first-child{grid-row:span 2}
.info{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;flex:1;text-align:center}
.nm{font-weight:700;font-size:14px;line-height:1.3;unicode-bidi:plaintext}
.tg{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tg span{font-size:11px;font-weight:700;color:#cfe4ff;border:1px solid var(--line);background:#0b1e3d;border-radius:99px;padding:1px 8px}
.pr{margin-top:auto;font:800 18px Changa,sans-serif}.pr small{font:400 12px Tajawal;color:var(--mu)}
.out{color:var(--cir)}
.cta{color:#fff;text-decoration:none;font-weight:700;font-size:13px;background:var(--ps);border-radius:8px;padding:6px}
.emo{font-size:46px;display:grid;place-items:center;aspect-ratio:2/1;background:linear-gradient(135deg,#06183a,#0b2f66)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
</style>
</head>
<body>
<header class="hero"><img src="assets/logo.webp" alt="ZAZA بتاع ألعاب"><nav class="wa" id="wa"></nav></header>
<div class="bar">
  <div class="tabs" role="tablist" id="tabs">
  </div>
  <div class="chips" id="chips" hidden></div>
  <input id="q" type="search" placeholder="دوّر على لعبة…" aria-label="بحث" dir="auto">
  <div id="cnt"></div>
</div>
<main><div id="out"></div></main>
<footer>ZAZA بتاع ألعاب</footer>
<script src="data/catalog.js"></script>
<script>
const C=window.CATALOG,$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ph=C.phones[0],wa=t=>`https://wa.me/2${ph}?text=${encodeURIComponent(t)}`;
$('#wa').innerHTML=C.phones.map(p=>`<a href="https://wa.me/2${p}">واتساب ${p}</a>`).join('');
const price=p=>p?`<div class="pr">${p} <small>ج</small></div>`:`<div class="pr"><small>اسأل عن السعر</small></div>`;
const tile=i=>i.icon?`<img loading="lazy" src="${encodeURI(i.icon)}" alt="${E(i.title)}">`:`<div class="ph">${E(i.title.replace(/[^A-Za-z0-9\u0600-\u06ff ]/g,'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase())}</div>`;
function icon(items){const n=items.length,k=n==1?'n1':n==2?'n2':n<=4?'g2':'g3';return `<div class="ic ${k}${n==3?' c3':''}">${items.map(tile).join('')}</div>`}
function card(vis,name,tags,pr,label){return `<article class="card">${vis}<div class="info"><div class="nm" dir="auto">${E(name)}</div><div class="tg">${tags.map(t=>`<span>${E(t)}</span>`).join('')}</div>${pr}<a class="cta" href="${wa('عايز '+name+(label?' ('+label+')':''))}">اطلب واتساب</a></div></article>`}
const emoji=n=>/ماوس/.test(n)?'🖱️':/سماعة/.test(n)?'🎧':/هارد/.test(n)?'💾':/كشاف/.test(n)?'🔦':/شاحن|وصلة|كبل/.test(n)?'🔌':/دراع/.test(n)?'🎮':'🕹️';
const K={
 modded:t=>({kind:'modded',list:()=>C.games[t.id],key:g=>g.title,html:g=>card(icon([{title:g.title,icon:g.icon}]),g.title,g.ps2?['PS2']:[],price(g.price),t.title)}),
 originals:t=>({kind:'originals',list:()=>C.originals,key:g=>g.title,html:g=>`<article class="card">${icon([{title:g.title,icon:g.icon}])}<div class="info"><div class="nm" dir="auto">${E(g.title)}</div><div class="tg">${g.badges.map(b=>`<span>${E(b)}</span>`).join('')}</div>${g.prices.length?g.prices.map(p=>`<a class="cta" href="${wa('عايز '+g.title+' ('+p[0]+')')}">${E(p[0])} · ${p[1]} ج</a>`).join(''):price(0)+`<a class="cta" href="${wa('عايز '+g.title)}">اطلب واتساب</a>`}</div></article>`}),
 accounts:t=>({kind:'accounts',list:()=>C.accts[t.id],key:g=>g.name,html:g=>card(icon(g.items),g.name,[...(g.items.length>1?[g.items.length+' ألعاب']:[]),...g.badges],price(g.price),t.title)}),
 products:t=>({kind:'products',list:()=>C.products,key:g=>g.name,html:g=>card(`<div class="emo">${emoji(g.name)}</div>`,g.name,g.in_stock?[]:['نفذت الكمية'],price(g.price),'')})
};
const V={};C.tabs.forEach(t=>V[t.id]=K[t.kind](t));
$('#tabs').innerHTML=C.tabs.map(t=>`<button role="tab" data-t="${t.id}"><b style="color:var(${t.color})">${t.symbol}</b>${E(t.title)}</button>`).join('');
let tab=location.hash.slice(1);if(!V[tab])tab=C.tabs[0].id;let gen='';
function draw(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t==tab));
  $('.tabs [aria-selected=true]').scrollIntoView({inline:'center',block:'nearest'});
  const q=$('#q').value.trim().toLowerCase(),v=V[tab],all=v.list(),ch=$('#chips'),G=(C.genres||[]).filter(x=>all.some(g=>(g.genres||[]).includes(x)));
  if(!G.includes(gen))gen='';
  if(G.length){ch.hidden=false;ch.innerHTML=['',...G].map(x=>`<button data-g="${E(x)}" aria-pressed="${x==gen}">${x?E(x):'الكل'}</button>`).join('')}else{ch.hidden=true;gen=''}
  const l=all.filter(g=>v.key(g).toLowerCase().includes(q)&&(!gen||(g.genres||[]).includes(gen)));
  $('#cnt').textContent=(q||gen)?`${l.length} من ${all.length}`:`${all.length} ${v.kind=='products'?'منتج':'لعبة'}`;
  if(v.kind=='products'&&!q){const m={};l.forEach(g=>(m[g.cat]=m[g.cat]||[]).push(g));
    $('#out').innerHTML=Object.keys(m).map(c=>`<h2>${E(c)}</h2><div class="grid">${m[c].map(v.html).join('')}</div>`).join('')}
  else $('#out').innerHTML=`<div class="grid">${l.map(v.html).join('')||'<p class="empty">مفيش نتيجة</p>'}</div>`;
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;history.replaceState(0,'','#'+tab);draw()}};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(b){gen=b.dataset.g;draw()}};
$('#q').oninput=draw;draw();
</script>
</body>
</html>
