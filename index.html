:root{--eo:cubic-bezier(.23,1,.32,1);--ed:cubic-bezier(.32,.72,0,1)}
html{-webkit-tap-highlight-color:transparent}
body.lk{position:fixed;width:100%;overflow:hidden}
dialog{overscroll-behavior:contain}
button,a,.tile{touch-action:manipulation}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes sheet{from{opacity:0;transform:translateY(28px)}}
@keyframes fi{from{opacity:0}}
@keyframes flt{50%{transform:translateY(-5px)}}
.hero img{animation:pop .7s var(--eo) backwards}
.tile{animation:pop .5s var(--eo) backwards;animation-delay:calc(var(--i,0)*60ms);transition:transform .2s var(--eo),border-color .2s,box-shadow .2s}
.tile svg{animation:flt 3.2s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.45s)}
.card{transition:transform .2s var(--eo),border-color .2s,box-shadow .2s}
.ic img{transition:transform .5s var(--eo),opacity .35s}.ic img:not(.ld){opacity:0}
.add,.shr,.fab,.back,.flt,.tabs button,.chips button,.fl button{transition:transform .15s var(--eo),background-color .2s,border-color .2s}
.tile:active,.card:active{transform:scale(.98)}.add:active,.shr:active,.fab:active,.back:active,.flt:active{transform:scale(.95)}
@media(hover:hover) and (pointer:fine){.card:hover{transform:translateY(-3px)}.card:hover .ic img{transform:scale(1.06)}.tile:hover{transform:translateY(-4px)}.tile:hover svg{animation-play-state:paused}}
dialog[open]{animation:sheet .3s var(--ed)}dialog[open]::backdrop{animation:fi .25s ease-out}
.fab{animation:pop .35s var(--eo)}.tabs button[aria-selected=true] svg{animation:pop .35s var(--eo)}
.card[data-oos] .ic>*{filter:grayscale(1) opacity(.5)}.card[data-oos] .ic::after{content:"نفذت الكمية";position:absolute;inset-inline:0;bottom:0;z-index:3;background:#ff5a67e6;color:#fff;text-align:center;font:800 13px Changa,sans-serif;padding:4px}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#ld{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#0b1d3f,#030712 70%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s .2s}
#ld.on,.intro #ld{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .18s ease}
.intro #ld{animation:ldx .01s 4s forwards}@keyframes ldx{to{opacity:0;visibility:hidden}}
#ld svg{width:min(66vw,300px);overflow:visible;filter:drop-shadow(0 0 14px #33a6ff66)}
.lt{font:800 100px Changa,sans-serif;fill:transparent;stroke:#33a6ff;stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420}
#ld.on .lt{animation:dr .55s var(--eo) .08s forwards,fl .3s ease .45s forwards}
.intro #ld .lt{animation:dr .95s var(--eo) .15s forwards,fl .4s ease .85s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl{to{fill:#33a6ff}}
#sp{position:fixed;top:0;inset-inline:0;height:3px;z-index:60;background:linear-gradient(90deg,#0a7fe8,#33a6ff,#3bd1a8);transform-origin:100% 50%;transform:scaleX(0);pointer-events:none}
.tile{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(circle,#33a6ff66,transparent 65%);transform:scale(0);animation:rp .6s var(--eo) forwards}@keyframes rp{to{transform:scale(1);opacity:0}}
.card.rv{opacity:0}.card.show{animation:up .45s var(--eo) backwards}
[hidden]{display:none!important}

/* ===== الواجهة الجديدة ===== */
:root{--cir:#ff6fd0;--sq:#b98cff}
.hero{display:block;padding:12px 12px 0;max-width:1100px;margin:0 auto}
.zq{position:relative}.zq svg{position:absolute;inset-inline-start:14px;top:14px;width:20px;height:20px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round}
.zq input{height:48px;border-radius:14px;padding-inline-start:44px;font-size:16px}
.zs{position:relative;height:224px;margin:12px 0 10px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--panel);touch-action:pan-y}
.zl{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:18px 18px 30px;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s;overflow:hidden}
.zl.on{opacity:1;visibility:visible;transition:opacity .5s}
.zl::before{content:"";position:absolute;inset:0;background:var(--g)}
.zl::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,#ffffff22,transparent 55%)}
.zl>*{position:relative;z-index:1}
.hero .zs img{width:auto;max-width:none;aspect-ratio:auto;mix-blend-mode:normal;animation:none}
.zt{flex:1;display:grid;gap:6px;justify-items:start;min-width:0}
.zlb{font:700 12px Changa,sans-serif;color:var(--tri);letter-spacing:.5px}
.zn{font:800 56px/1 Changa,sans-serif;background:linear-gradient(180deg,#fff,#a9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.zn small{font:800 20px Changa,sans-serif;margin-inline-start:6px;-webkit-text-fill-color:#dfe9ff}
.zt p{color:#c3cfea;font-size:13.5px;line-height:1.45;margin:0;text-align:start}
.zc{min-height:40px;padding:0 20px;border:0;border-radius:12px;color:#fff;font:800 14px Changa,sans-serif;background:linear-gradient(90deg,#2a7be8,#9a63ff);cursor:pointer}
.zl.on .zt>*{animation:up .5s var(--eo) backwards}.zl.on .zt>:nth-child(2){animation-delay:.08s}.zl.on .zt>:nth-child(3){animation-delay:.16s}.zl.on .zt>:nth-child(4){animation-delay:.24s}
.zk{position:relative;width:136px;height:150px;flex:none;animation:flt 6s ease-in-out infinite}
.hero .zk img{position:absolute;width:98px;height:98px;border-radius:14px;object-fit:cover;box-shadow:0 12px 26px #000a;outline:1px solid #ffffff2a}
.zk img:nth-child(1){top:0;inset-inline-end:0;transform:rotate(9deg);opacity:.85}.zk img:nth-child(2){top:26px;inset-inline-start:0;transform:rotate(-8deg);opacity:.9}.zk img:nth-child(3){bottom:0;inset-inline-end:14px;width:106px;height:106px}
.zp{position:relative;width:132px;height:132px;flex:none;animation:flt 6s ease-in-out infinite}
.zp i{position:absolute;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#0b1233cc;border:1.5px solid currentColor;box-shadow:0 0 16px currentColor}
.zp i:nth-child(1){top:0;left:43px;color:var(--tri)}.zp i:nth-child(2){right:0;top:43px;color:#ff8fd8}.zp i:nth-child(3){bottom:0;left:43px;color:var(--crs)}.zp i:nth-child(4){left:0;top:43px;color:var(--sq)}.zp svg{display:block}
.zw{position:absolute;z-index:0;inset:-30% -25%;display:grid;gap:8px;direction:ltr;transform:rotate(-9deg);opacity:.55}
.zw div{display:flex;gap:8px;width:max-content;animation:mq 46s linear infinite}.zw div:nth-child(2){animation-direction:reverse;animation-duration:58s}
.hero .zw img{width:86px;height:86px;border-radius:12px;object-fit:cover}
@keyframes mq{to{transform:translateX(-50%)}}
