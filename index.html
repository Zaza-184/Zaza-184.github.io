<style>

.card{position:relative}

button.nm{background:none;border:0;color:inherit;font:700 14px/1.3 Tajawal,sans-serif;cursor:pointer;padding:0}
.card .ic,.card .emo{cursor:pointer}
#dd{position:relative;padding-top:56px}
.x{position:absolute;top:8px;inset-inline-end:10px;width:44px;height:44px;border:0;border-radius:12px;background:#0b1e3d;color:var(--mu);font-size:24px;cursor:pointer}
.dh{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.cvr{flex:none;width:130px;border-radius:14px;overflow:hidden}
#dd .ic{border-radius:14px;overflow:hidden;margin-bottom:10px}.dh .ic{margin:0}
.fl2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.ch{font-size:12px;color:#cfe4ff;background:#0b1e3d;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.bd{font-size:16px;line-height:1.7;color:#dbe7fb;margin-bottom:12px}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#0b1e3d;color:#fff;text-decoration:none;font-weight:700;margin-bottom:12px}
.gl{list-style:none;padding:0;display:grid;gap:8px;margin-bottom:12px}.gl li{display:flex;gap:10px;align-items:center;background:#0b1e3d;border:1px solid var(--line);border-radius:12px;padding:8px}
.gl img,.gl .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}.gl div{flex:1;display:flex;flex-direction:column;gap:2px}.gl small{color:var(--mu);font-size:12.5px;line-height:1.4}
.ytb{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#050a18}
.inf{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px}.inf div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px}.inf div:nth-child(odd){background:#0b1e3d}.inf dt{color:var(--mu)}.inf dd{margin:0;font-weight:700;text-align:end}
.ft .sh2{display:flex;align-items:center;justify-content:center;gap:8px}
.ts{position:fixed;left:16px;right:16px;bottom:28px;max-width:420px;margin:auto;height:52px;border-radius:12px;background:#0f6b55;color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px Tajawal,sans-serif;z-index:99}
.vp{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;cursor:pointer;margin-bottom:8px}
.vp img{width:100%;height:100%;object-fit:cover;opacity:.9}.vp .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.vp .pl svg{width:64px;height:64px;filter:drop-shadow(0 2px 8px #0009)}
.vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.gl .vp{margin:-2px 0 0}
.yl{display:block;text-align:center;color:var(--mu);font-size:13px;margin-bottom:12px;text-decoration:underline}
button.ytb{border:0;cursor:pointer}
.gl .pc{color:#cfe4ff}.gl .pc::before{content:"عدد اللاعبين: ";color:var(--mu)}

:root{--eo:cubic-bezier(.23,1,.32,1);--ed:cubic-bezier(.32,.72,0,1)}
html{-webkit-tap-highlight-color:transparent}
body.lk{position:fixed;width:100%;overflow:hidden}
dialog{overscroll-behavior:contain}
button,a,.tile{touch-action:manipulation}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes sheet{from{opacity:0;transform:translateY(28px)}}
@keyframes fi{from{opacity:0}}
@keyframes flt{50%{transform:translateY(-5px)}}
.hero img{animation:pop .7s var(--eo) backwards}
.tile{animation:pop .5s var(--eo) backwards;animation-delay:calc(var(--i,0)*60ms);transition:transform .2s var(--eo),border-color .2s,box-shadow .2s}
.tile svg{animation:flt 3.2s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.45s)}
.an .card{animation:up .45s var(--eo) backwards;animation-delay:calc(min(var(--i,0),11)*45ms)}
.card{transition:transform .2s var(--eo),border-color .2s,box-shadow .2s}
.ic img{transition:transform .5s var(--eo),opacity .35s}.ic img:not(.ld){opacity:0}
.add,.shr,.fab,.back,.flt,.tabs button,.chips button,.fl button{transition:transform .15s var(--eo),background-color .2s,border-color .2s}
.tile:active,.card:active{transform:scale(.98)}.add:active,.shr:active,.fab:active,.back:active,.flt:active{transform:scale(.95)}
@media(hover:hover) and (pointer:fine){.card:hover{transform:translateY(-3px)}.card:hover .ic img{transform:scale(1.06)}.tile:hover{transform:translateY(-4px)}.tile:hover svg{animation-play-state:paused}}
dialog[open]{animation:sheet .3s var(--ed)}dialog[open]::backdrop{animation:fi .25s ease-out}
.fab{animation:pop .35s var(--eo)}.tabs button[aria-selected=true] svg{animation:pop .35s var(--eo)}
.card[data-oos] .ic>*{filter:grayscale(1) opacity(.5)}.card[data-oos] .ic::after{content:"نفذت الكمية";position:absolute;inset-inline:0;bottom:0;z-index:3;background:#ff5a67e6;color:#fff;text-align:center;font:800 13px Changa,sans-serif;padding:4px}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
[hidden]{display:none!important}
</style>

<body>
<header class="hero" id="hero"><img src="assets/logo.webp" alt="ZAZA بتاع ألعاب"><h1 class="tag">كل ما تحتاجه في عالم البلايستيشن</h1><p>ألعاب وأكونتات وملحقات، وطلبك على واتساب</p><nav class="wa" id="wa"></nav></header>
<section class="home" id="home" aria-label="الأقسام"></section>
<div class="bar" id="bar" hidden>
  <div class="top"><button class="back" id="back">‹ الرئيسية</button><strong id="ttl"></strong></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <input id="q" type="search" placeholder="دوّر على لعبة…" aria-label="بحث" dir="auto">
  <div class="row"><button class="flt" id="flt" hidden>الفلتر<b id="fb"></b></button><div id="cnt"></div></div>
</div>
<main id="main" hidden><div id="out"></div></main>
<button class="fab" id="fab" hidden>🛒 السلة <b id="fc">0</b></button>
<dialog id="fd" aria-label="الفلتر"><h3>الفلتر</h3><div class="fl" id="fl"></div><div class="ft"><button class="gh" id="fclr">مسح</button><button id="fok"></button></div></dialog>
<dialog id="cd" aria-label="السلة"></dialog>
<dialog id="dd" aria-label="تفاصيل اللعبة"></dialog><div class="ts" id="ts" role="status" hidden></div>
<footer>ZAZA بتاع ألعاب</footer>
<script src="data/catalog.js"></script>
<script>
fetch('data/live.json?'+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})).then(L=>{
const C=window.CATALOG,$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
/* تعديلات المالك من لوحة التحكم (data/live.json): نفاد الكمية، ألعاب مضافة، فيديوهات */
const oos=h=>h.replace(/(<button class="add"[^>]*>[^<]*<\/button>)+/,'<button class="add" disabled>نفذت الكمية</button>').replace('<article ','<article data-oos ');
(function(){const S=L.oos||{},VD=L.videos||{},PS=L.pstock||{},has=(t,k)=>(S[t]||[]).includes(k),vid=i=>{if(VD[i.title])i.video=VD[i.title]};
for(const g of L.added||[]){const l=C.games[g.tab];if(l&&!l.some(x=>x.title==g.title)){l.push({title:g.title,icon:g.icon,ps2:false,price:g.price||null,genres:g.genres||[],blurb:g.blurb||'',video:g.video||'',players:g.players||''});(g.genres||[]).forEach(x=>C.genres.includes(x)||C.genres.push(x))}}
Object.entries(C.games).forEach(([t,l])=>l.forEach(g=>{vid(g);g.oos=has(t,g.title)}));
C.originals.forEach(g=>{vid(g);g.oos=has('originals',g.title)});
Object.entries(C.accts).forEach(([t,l])=>l.forEach(a=>{a.items.forEach(vid);a.oos=has(t,a.name)}));
C.products.forEach(p=>{if(p.name in PS)p.in_stock=PS[p.name]})})();
const wa=(p,t)=>`https://wa.me/2${p}?text=${encodeURIComponent(t)}`;
$('#wa').innerHTML=C.phones.map(p=>`<a href="https://wa.me/2${p}">واتساب ${p}</a>`).join('');
const price=p=>p?`<div class="pr">${p} <small>ج</small></div>`:`<div class="pr"><small>اسأل عن السعر</small></div>`;
const tile=i=>i.icon?`<img loading="lazy" src="${encodeURI(i.icon)}" alt="${E(i.title)}">`:`<div class="ph">${E(i.title.replace(/[^A-Za-z0-9\u0600-\u06ff ]/g,'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase())}</div>`;
function icon(items){const n=items.length;if(n==1)return `<div class="ic n1">${tile(items[0])}</div>`;const r=n<=4?n:n<=6?3:4,b=items[0].icon?`--b:url('${encodeURI(items[0].icon)}');`:'';return `<div class="ic mg" style="${b}--r:${r}">${items.map(tile).join('')}</div>`}
/* السلة */
let cart=[];try{cart=JSON.parse(localStorage.getItem('zaza_cart')||'[]')}catch(e){}
const R={},save=()=>{try{localStorage.setItem('zaza_cart',JSON.stringify(cart))}catch(e){}},inCart=id=>cart.some(x=>x.id==id);
const line=x=>x.name+(x.label?' ('+x.label+')':'');
function addBtn(name,label,pr,opt){const id=tab+'|'+name+'|'+(opt||''),t0=opt?`＋ ${opt} · ${pr} ج`:'＋ أضف للسلة',t1=opt?`✓ ${opt} في السلة`:'✓ في السلة';R[id]={id,name,label:opt?(label?label+' - ':'')+opt:label,price:pr};return `<button class="add" data-id="${E(id)}" data-t0="${E(t0)}" data-t1="${E(t1)}" aria-pressed="${inCart(id)}">${E(inCart(id)?t1:t0)}</button>`}
function sync(){document.querySelectorAll('.ic img:not(.ld)').forEach(m=>{const f=()=>m.classList.add('ld');m.complete?f():(m.addEventListener('load',f,{once:true}),m.addEventListener('error',f,{once:true}))});document.querySelectorAll('.add[data-id]').forEach(b=>{const on=inCart(b.dataset.id);b.setAttribute('aria-pressed',on);b.textContent=on?b.dataset.t1:b.dataset.t0});$('#fc').textContent=cart.length;$('#fab').hidden=!cart.length}
function msg(){const all=cart.every(x=>x.price),t=cart.reduce((s,x)=>s+(+x.price||0),0);return 'السلام عليكم، عايز أطلب:\n'+cart.map((x,i)=>`${i+1}) ${line(x)}${x.price?' - '+x.price+' ج':''}`).join('\n')+(all&&cart.length?`\nالإجمالي: ${t} ج`:'')}
function drawCart(){const d=$('#cd');if(!cart.length){d.innerHTML='<h3>السلة فاضية</h3><p class="hint">ضيف الألعاب اللي عايزها من الأقسام وارجع هنا.</p><div class="ft"><button id="cx">تمام</button></div>';return}
  const all=cart.every(x=>x.price),t=cart.reduce((s,x)=>s+(+x.price||0),0);
  d.innerHTML=`<h3>سلتك (${cart.length})</h3><ul class="cl">${cart.map(x=>`<li><span dir="auto">${E(line(x))}</span>${x.price?`<em>${x.price} ج</em>`:''}<button data-rm="${E(x.id)}" aria-label="إزالة">×</button></li>`).join('')}</ul>${all?`<div class="tot">الإجمالي: ${t} ج</div>`:'<div class="hint">الأسعار اللي مش مكتوبة هنأكدها معاك على واتساب.</div>'}<div class="hint">اختار رقم الواتساب اللي هتبعت عليه الطلب:</div><div class="sd">${C.phones.map(p=>`<a class="send" target="_blank" rel="noopener" href="${wa(p,msg())}">ابعت الطلب على ${p}</a>`).join('')}</div><div class="ft"><button class="clr" id="cc">فضّي السلة</button><button class="gh" id="cx">إغلاق</button></div>`}
$('#fab').onclick=()=>{drawCart();$('#cd').showModal()};
$('#cd').onclick=e=>{const t=e.target,rm=t.closest('[data-rm]');if(rm){cart=cart.filter(x=>x.id!=rm.dataset.rm);save();sync();drawCart()}else if(t.id=='cc'){cart=[];save();sync();drawCart()}else if(t.id=='cx'||t==$('#cd'))$('#cd').close()};
document.addEventListener('click',e=>{const b=e.target.closest('.add[data-id]');if(!b)return;const id=b.dataset.id,i=cart.findIndex(x=>x.id==id);i<0?cart.push(R[id]):cart.splice(i,1);save();sync()});
/* الكروت: اسم الرسالة بيشمل النسخة (Ultimate…) والمنصة بين قوسين */
function card(vis,name,tags,pr,label,bl,wide,btn){return `<article class="card${wide?' wide':''}">${vis}<div class="info"><div class="nm" dir="auto">${E(name)}</div><div class="tg">${tags.map(t=>`<span>${E(t)}</span>`).join('')}</div>${bl?`<p class="bl" dir="auto">${E(bl)}</p>`:''}${pr}<div class="acts">${btn}</div></div></article>`}
const emoji=n=>/ماوس/.test(n)?'🖱️':/سماعة/.test(n)?'🎧':/هارد/.test(n)?'💾':/كشاف/.test(n)?'🔦':/شاحن|وصلة|كبل/.test(n)?'🔌':/دراع/.test(n)?'🎮':'🕹️';
const K={
 modded:t=>({kind:'modded',list:()=>C.games[t.id],key:g=>g.title,html:g=>card(icon([{title:g.title,icon:g.icon}]),g.title,g.ps2?['PS2']:[],price(g.price),t.title,g.blurb,0,addBtn(g.title,t.title,g.price))}),
 originals:t=>({kind:'originals',list:()=>C.originals,key:g=>g.title,html:g=>card(icon([{title:g.title,icon:g.icon}]),g.title,g.badges,g.prices.length?'':price(0),'',g.blurb,0,g.prices.length?g.prices.map(p=>addBtn(g.title,t.title,p[1],p[0])).join(''):addBtn(g.title,t.title,0))}),
 accounts:t=>({kind:'accounts',list:()=>C.accts[t.id],key:g=>g.name,html:g=>{const vb=g.badges.filter(b=>!/^PS\d|PS4 \+ PS5|PS5/.test(b)),nm=g.name+(vb.length?' '+vb.join(' '):'');return card(icon(g.items),g.name,[...(g.items.length>1?[g.items.length+' ألعاب']:[]),...g.badges],price(g.price),t.title,g.items.length==1?g.items[0].blurb:'',g.items.length>1,addBtn(nm,t.title,g.price))}}),
 products:t=>({kind:'products',list:()=>C.products,key:g=>g.name,html:g=>card(`<div class="emo">${emoji(g.name)}</div>`,g.name,g.in_stock?[]:['نفذت الكمية'],price(g.price),'','',0,g.in_stock?addBtn(g.name,'',g.price):'<button class="add" disabled>نفذت الكمية</button>')})
};
const CAP={modded:'ألعاب PS4 معدّلة وجاهزة للتشغيل',ps5:'ألعاب PS5 معدّلة',ps3:'ألعاب PS3 معدّلة',originals:'نسخ أصلية بأنظمة Off و Online و Pr',accounts:'أكونتات PS4 بألعاب كاملة',accounts5:'أكونتات PS5 بأحدث الإصدارات',products:'دراعات وشواحن وكل ملحقات البلايستيشن'};
const SY={'△':'<path d="M12 4 21 20H3z"/>','○':'<circle cx="12" cy="12" r="8"/>','✕':'<path d="M5 5l14 14M19 5 5 19"/>','□':'<rect x="4" y="4" width="16" height="16" rx="1"/>'};
const sym=(t,n)=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="var(${t.color})" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SY[t.symbol]||SY['△']}</svg>`;
const V={};C.tabs.forEach(t=>V[t.id]=K[t.kind](t));
$('#home').innerHTML=C.tabs.map((t,ti)=>{const n=V[t.id].list().length;return `<button class="tile" style="--i:${ti}" data-t="${t.id}">${sym(t,50)}<span class="tt">${E(t.title)}</span><span class="cp">${CAP[t.id]||''}</span><span class="ct">${n} ${t.kind=='products'?'منتج':'لعبة'}</span></button>`}).join('');
$('#tabs').innerHTML=C.tabs.map(t=>`<button role="tab" data-t="${t.id}">${sym(t,18)}${E(t.title)}</button>`).join('');
let tab='',sel=new Set,CUR=[];
function route(){const [h,gk]=location.hash.slice(1).split('/'),home=!V[h];tab=home?'':h;sel=new Set;$('#hero').hidden=$('#home').hidden=!home;$('#bar').hidden=$('#main').hidden=home;scrollTo(0,0);if(!home){$('#q').value='';$('#ttl').textContent=C.tabs.find(t=>t.id==tab).title;draw();if(gk){const k=decodeURIComponent(gk),i=CUR.findIndex(g=>V[tab].key(g)==k);if(i>=0)openD(i)}}}
function genres(){const all=V[tab].list();return (C.genres||[]).filter(x=>all.some(g=>(g.genres||[]).includes(x)))}
function draw(a=1){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t==tab));
  $('.tabs [aria-selected=true]').scrollIntoView({inline:'center',block:'nearest'});
  const q=$('#q').value.trim().toLowerCase(),v=V[tab],all=v.list(),G=genres(),act=sel.size>0;
  $('#flt').hidden=!G.length;$('#fb').textContent=sel.size||'';
  const l=all.filter(g=>v.key(g).toLowerCase().includes(q)&&(!act||(g.genres||[]).some(x=>sel.has(x)))).sort((a,b)=>!!a.oos-!!b.oos);
  CUR=l;$('#out').className=a?'an':'';$('#cnt').textContent=(q||act)?`${l.length} من ${all.length}`:`${all.length} ${v.kind=='products'?'منتج':'لعبة'}`;
  if(v.kind=='products'&&!q){const m={};l.forEach(g=>(m[g.cat]=m[g.cat]||[]).push(g));
    $('#out').innerHTML=Object.keys(m).map(c=>`<h2>${E(c)}</h2><div class="grid">${m[c].map(v.html).join('')}</div>`).join('')}
  else $('#out').innerHTML=`<div class="grid">${l.map((g,i)=>deco(g.oos?oos(v.html(g)):v.html(g),i)).join('')||'<p class="empty">مفيش نتيجة</p>'}</div>`;
  sync();
}
function drawFilter(){const v=V[tab],all=v.list(),n=all.filter(g=>!sel.size||(g.genres||[]).some(x=>sel.has(x))).length;
  $('#fl').innerHTML=genres().map(x=>`<button data-g="${E(x)}" aria-pressed="${sel.has(x)}">${E(x)}</button>`).join('');$('#fok').textContent=`عرض ${n} ${v.kind=='products'?'منتج':'لعبة'}`}
/* التفاصيل والمشاركة وتريلر يوتيوب */
const ICO_SH='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',ICO_PL='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#ff5c5c"/></svg>';
const PLAY='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#fff"/><path d="M26 20v24l20-12z" fill="#000"/></svg>';
const vp=id=>`<div class="vp" role="button" tabindex="0" data-v="${id}" aria-label="تشغيل التريلر"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><span class="pl">${PLAY}</span></div><a class="yl" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${id}">لو الفيديو مش بيشتغل افتحه على يوتيوب</a>`;
const ifr=id=>`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="تريلر اللعبة"></iframe>`;
function playV(v){const id=v.dataset.v;if(v.classList.contains('vp')){v.innerHTML=ifr(id);v.removeAttribute('data-v');v.removeAttribute('role')}else{const li=v.closest('li'),n=li.nextElementSibling;if(n&&n.classList.contains('vp'))n.remove();else li.insertAdjacentHTML('afterend',`<div class="vp">${ifr(id)}</div>`)}}
document.addEventListener('click',e=>{const v=e.target.closest('[data-v]');if(v)playV(v)});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches&&e.target.matches('.vp[data-v]')){e.preventDefault();playV(e.target)}});
const yt=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' trailer');
const deco=(h,i)=>h.replace(/<article ([^>]*)>/,`<article data-i="${i}" style="--i:${i}" $1><button class="shr" data-s="${i}" aria-label="مشاركة">${ICO_SH}</button>`).replace('<div class="nm"','<button class="nm" type="button"').replace('</div><div class="tg">','</button><div class="tg">');
function toast(t){const e=$('#ts');(document.querySelector('dialog[open]')||document.body).appendChild(e);e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function copy(u){(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('تم نسخ رابط اللعبة')).catch(()=>prompt('انسخ الرابط',u))}
function share(i){const g=CUR[i],n=g.name||g.title,u=location.href.split('#')[0]+'#'+tab+'/'+encodeURIComponent(V[tab].key(g));
  if(navigator.share)navigator.share({title:n+' - ZAZA',text:n,url:u}).catch(e=>{if(!e||e.name!='AbortError')copy(u)});else copy(u)}
function openD(i){const g=CUR[i],k=V[tab].kind,t=C.tabs.find(x=>x.id==tab);let items,nm,tags,rows=[['القسم',t.title]],add;
  if(k=='accounts'){items=g.items;nm=g.name;tags=g.badges;const vb=g.badges.filter(b=>!/^PS\d|PS4 \+ PS5|PS5/.test(b));
    if((g.platforms||[]).length)rows.push(['المنصة',g.platforms.join(' + ')]);if(vb.length)rows.push(['النسخة',vb.join('، ')]);if(items.length>1)rows.push(['عدد الألعاب',items.length]);
    add=addBtn(nm+(vb.length?' '+vb.join(' '):''),t.title,g.price)}
  else{items=[{title:g.title,icon:g.icon,blurb:g.blurb,video:g.video,players:g.players}];nm=g.title;tags=g.badges||g.genres||[];if((g.genres||[]).length)rows.push(['التصنيف',g.genres.join('، ')]);
    add=k=='originals'&&g.prices.length?g.prices.map(p=>addBtn(g.title,t.title,p[1],p[0])).join(''):addBtn(g.title,t.title,g.price||0)}
  if(g.oos)add='<button class="add" disabled>نفذت الكمية</button>';
  if(items.length==1&&items[0].players)rows.push(['عدد اللاعبين',items[0].players]);
  const multi=items.length>1,chips=tags.map(x=>`<span class="ch">${E(x)}</span>`).join(''),
  head=multi?`${icon(items)}<h3 dir="auto">${E(nm)}</h3><div class="fl2">${chips}</div>`:`<div class="dh"><div class="cvr">${icon(items)}</div><div><h3 dir="auto">${E(nm)}</h3><div class="fl2">${chips}</div></div></div>`,
  body=multi?`<ul class="gl">${items.map(x=>`<li>${tile(x)}<div><b dir="auto">${E(x.title)}</b><small>${E(x.blurb||'')}</small>${x.players?`<small class="pc">${E(x.players)}</small>`:''}</div>${x.video?`<button class="ytb" data-v="${x.video}" aria-label="تشغيل تريلر ${E(x.title)}">${ICO_PL}</button>`:`<a class="ytb" target="_blank" rel="noopener" href="${yt(x.title)}" aria-label="تريلر ${E(x.title)} على يوتيوب">${ICO_PL}</a>`}</li>`).join('')}</ul>`:
  `${items[0].blurb?`<p class="bd" dir="auto">${E(items[0].blurb)}</p>`:''}${items[0].video?vp(items[0].video):`<a class="yt" target="_blank" rel="noopener" href="${yt(items[0].title)}">${ICO_PL} تريلر اللعبة على يوتيوب</a>`}`;
  $('#dd').innerHTML=`<button class="x" data-x aria-label="إغلاق">×</button>${head}${body}<dl class="inf">${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${E(r[1])}</dd></div>`).join('')}</dl><div class="ft">${add}<button class="gh sh2" data-s="${i}">${ICO_SH} مشاركة</button></div>`;
  $('#dd').showModal();sync()}
document.addEventListener('click',e=>{const s=e.target.closest('[data-s]');if(s){share(+s.dataset.s);return}
  const a=e.target.closest('article[data-i]');if(a&&!e.target.closest('.add'))openD(+a.dataset.i)});
$('#dd').addEventListener('close',()=>{$('#dd').innerHTML=''});
$('#dd').onclick=e=>{const d=$('#dd'),r=d.getBoundingClientRect();if(e.target.closest('[data-x]')||e.clientY<r.top||e.clientX<r.left||e.clientX>r.right||e.clientY>r.bottom)d.close()};
$('#flt').onclick=()=>{drawFilter();$('#fd').showModal()};
$('#fl').onclick=e=>{const b=e.target.closest('button');if(!b)return;sel.has(b.dataset.g)?sel.delete(b.dataset.g):sel.add(b.dataset.g);drawFilter();draw()};
$('#fclr').onclick=()=>{sel.clear();drawFilter();draw()};$('#fok').onclick=()=>$('#fd').close();
$('#fd').onclick=e=>{if(e.target==$('#fd'))$('#fd').close()};
document.addEventListener('click',e=>{const b=e.target.closest('.tile,#tabs button');if(b)location.hash=b.dataset.t});
$('#back').onclick=()=>{location.hash=''};
addEventListener('hashchange',route);
/* قفل سكرول الصفحة طول ما أي نافذة مفتوحة */
let sy=0;const lk=()=>{const b=document.body,o=document.querySelector('dialog[open]');if(o&&!b.classList.contains('lk')){sy=scrollY;b.style.top=-sy+'px';b.classList.add('lk')}else if(!o&&b.classList.contains('lk')){b.classList.remove('lk');b.style.top='';scrollTo(0,sy)}};
const sm=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){sm.call(this);lk();this.addEventListener('close',lk,{once:true})};
$('#q').oninput=()=>draw(0);route();sync();
});
</script>
</body>
</html>
